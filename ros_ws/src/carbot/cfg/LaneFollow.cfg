#!/usr/bin/env python
PACKAGE = "carbot"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ==================== HSV WHITE THRESHOLD ====================
gen.add("h_min", int_t, 0, "Hue min",        0,   0, 179)
gen.add("h_max", int_t, 0, "Hue max",        180, 0, 179)
gen.add("s_min", int_t, 0, "Saturation min", 0,   0, 255)
gen.add("s_max", int_t, 0, "Saturation max", 60,  0, 255)
gen.add("v_min", int_t, 0, "Value min",      180, 0, 255)
gen.add("v_max", int_t, 0, "Value max",      255, 0, 255)

# ==================== ROI ====================
gen.add("roi_top_ratio", double_t, 0, "ROI mula dari peratus tinggi frame", 0.55, 0.10, 0.90)

# ==================== SLIDING WINDOW ====================
gen.add("num_windows",   int_t, 0, "Bilangan sliding window",     9,  3, 20)
gen.add("window_margin", int_t, 0, "Margin sliding window (px)", 60, 20, 150)
gen.add("min_pixels",    int_t, 0, "Minimum pixel untuk valid",  40, 10, 200)

# ==================== PID ====================
gen.add("kp", double_t, 0, "PID Proportional", 0.008, 0.0, 0.05)
gen.add("ki", double_t, 0, "PID Integral",     0.0001, 0.0, 0.01)
gen.add("kd", double_t, 0, "PID Derivative",   0.004, 0.0, 0.05)

# ==================== STEERING & SPEED ====================
gen.add("max_steer",      double_t, 0, "Steering maksimum",     0.6, 0.1, 1.0)
gen.add("base_speed",     double_t, 0, "Speed asas",            0.20, 0.05, 0.50)
gen.add("min_speed",      double_t, 0, "Speed minimum",         0.10, 0.05, 0.30)
gen.add("steer_deadzone", int_t,    0, "Deadzone (pixel)",      5,   0, 50)
gen.add("lp_alpha",       double_t, 0, "Low pass filter steer", 0.30, 0.05, 1.0)

# ==================== LANE WIDTH ESTIMATE ====================
gen.add("lane_width_ratio", double_t, 0, "Anggaran lane width (ratio frame width)", 0.50, 0.20, 0.90)

# ==================== SAVE TRIGGER ====================
gen.add("save_config", bool_t, 0, "Set true untuk save config ke fail (auto reset ke false)", False)

exit(gen.generate(PACKAGE, "lane_follow", "LaneFollow"))
