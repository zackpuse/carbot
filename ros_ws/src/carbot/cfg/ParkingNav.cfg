#!/usr/bin/env python
PACKAGE = "carbot"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ==================== PARALLEL PARKING ====================
gen.add("parallel_forward_dist", double_t, 0, "Forward distance before reversing (cm)", 20.0, 5.0, 50.0)
gen.add("parallel_reverse_dist", double_t, 0, "Total reverse distance (cm)", 35.0, 10.0, 80.0)
gen.add("parallel_steer_angle",  double_t, 0, "Steering angle while reversing", 0.8, 0.1, 1.0)

# ==================== PERPENDICULAR PARKING ====================
gen.add("perp_forward_dist", double_t, 0, "Forward distance before reversing (cm)", 10.0, 0.0, 40.0)
gen.add("perp_reverse_dist", double_t, 0, "Total reverse distance (cm)", 30.0, 10.0, 80.0)
gen.add("perp_steer_angle",  double_t, 0, "Steering angle while reversing", 0.0, -1.0, 1.0)

# ==================== SPEED ====================
gen.add("parking_speed",         double_t, 0, "Forward speed", 0.15, 0.05, 0.5)
gen.add("parking_reverse_speed", double_t, 0, "Reverse speed", -0.15, -0.5, -0.05)

# ==================== SAVE TRIGGER ====================
gen.add("save_config", bool_t, 0, "Set true to save config to file", False)

exit(gen.generate(PACKAGE, "parking_nav", "ParkingNav"))
